name: Cervical Cancer AI Detection CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-run:
    name: Run Tests & Verify Streamlit Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run Automated Test Suite
        run: |
          python run_tests.py

      - name: Verify Automated Detection Inference
        run: |
          python -c "
          from src.image_classifier import AutomaticCervicalDetector
          # 1. Verify MobileNetV3
          det_mob = AutomaticCervicalDetector('models/cervical_vision_model.pth', model_name='mobilenet_v3')
          res_m_norm = det_mob.detect('data/images/samples/real_herlev_normal_cell.jpg')
          res_m_abn = det_mob.detect('data/images/samples/real_herlev_cancer_lesion.jpg')
          print('MobileNetV3 Normal:', res_m_norm['prediction'], '| Conf:', res_m_norm['confidence'], '%')
          print('MobileNetV3 Cancer:', res_m_abn['prediction'], '| Conf:', res_m_abn['confidence'], '%')
          assert 'prediction' in res_m_norm and 'confidence' in res_m_norm

          # 2. Verify EfficientNet-B0
          det_eff = AutomaticCervicalDetector('models/cervical_efficientnet_b0.pth', model_name='efficientnet_b0')
          res_e_norm = det_eff.detect('data/images/samples/real_herlev_normal_cell.jpg')
          res_e_abn = det_eff.detect('data/images/samples/real_herlev_cancer_lesion.jpg')
          print('EfficientNet-B0 Normal:', res_e_norm['prediction'], '| Conf:', res_e_norm['confidence'], '%')
          print('EfficientNet-B0 Cancer:', res_e_abn['prediction'], '| Conf:', res_e_abn['confidence'], '%')
          assert 'prediction' in res_e_norm and 'confidence' in res_e_norm

          print('GitHub Actions multi-model detection verified successfully!')
          "
